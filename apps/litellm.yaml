apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/berriai
    chart: litellm-helm
    targetRevision: "1.106.4"
    helm:
      valuesObject:
        fullnameOverride: litellm
        replicaCount: 1
        serviceAccount:
          create: false
          name: litellm
        volumes:
          - name: aws-iam-token
            projected:
              sources:
                - serviceAccountToken:
                    audience: sts.amazonaws.com
                    expirationSeconds: 3600
                    path: token
        volumeMounts:
          - name: aws-iam-token
            mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
            readOnly: true
        envVars:
          AWS_ROLE_ARN: arn:aws:iam::416338380738:role/mini-ai-litellm-bedrock
          AWS_WEB_IDENTITY_TOKEN_FILE: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
          AWS_REGION: ap-south-1
          AWS_STS_REGIONAL_ENDPOINTS: regional
          OTEL_EXPORTER: otlp_http
          OTEL_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318
          OTEL_SERVICE_NAME: litellm-gateway
          LITELLM_OTEL_INTEGRATION_ENABLE_METRICS: "true"
          USE_OTEL_LITELLM_REQUEST_SPAN: "true"
          DEBUG_OTEL: "true"
        masterkeySecretName: litellm-masterkey
        masterkeySecretKey: masterkey
        db:
          useExisting: true
          deployStandalone: false
          endpoint: postgres.gateway.svc.cluster.local
          database: litellm
          secret:
            name: litellm-db
            usernameKey: username
            passwordKey: password
        environmentSecrets:
          - litellm-env
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {memory: 1536Mi}
        proxy_config:
          model_list:
            - model_name: local-small
              litellm_params:
                model: openai/qwen
                api_base: http://qwen-predictor.team-grid.svc.cluster.local/openai/v1
                api_key: none
                timeout: 90
                input_cost_per_token: 0.0000001
                output_cost_per_token: 0.0000004
            - model_name: bedrock-small
              litellm_params:
                model: bedrock/amazon.nova-micro-v1:0
                aws_region_name: ap-south-1
                timeout: 60
            - model_name: gemini-small
              litellm_params:
                model: gemini/gemini-3.5-flash-lite
                api_key: os.environ/GEMINI_API_KEY
                timeout: 60
            - model_name: gemini-lite-v2
              litellm_params:
                model: gemini/gemini-3.1-flash-lite
                api_key: os.environ/GEMINI_API_KEY
                timeout: 60
            - model_name: grid-assistant
              litellm_params:
                model: gemini/gemini-3.5-flash-lite
                api_key: os.environ/GEMINI_API_KEY
                timeout: 60
                weight: 1
              model_info:
                id: grid-assistant-stable
          router_settings:
            fallbacks:
              - local-small: [gemini-small, bedrock-small]
              - bedrock-small: [gemini-small]
          litellm_settings:
            callbacks: ["langfuse_otel", "otel"]
          callback_settings:
            otel:
              attributes:
                include_list:
                  - gen_ai.operation.name
                  - gen_ai.system
                  - gen_ai.request.model
                  - metadata.user_api_key_team_alias
        extraResources:
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: gateway-eval-gate
              annotations:
                argocd.argoproj.io/hook: PreSync
                argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
                argocd.argoproj.io/sync-wave: "-5"
            spec:
              backoffLimit: 0
              activeDeadlineSeconds: 1800
              template:
                spec:
                  restartPolicy: Never
                  containers:
                    - name: evals
                      image: python:3.12-slim
                      command:
                        - python
                        - /evals/run_evals.py
                      env:
                        - name: CANDIDATE_MODEL
                          value: grid-assistant
                        - name: PASS_THRESHOLD
                          value: "0.9"
                        - name: GATEWAY_URL
                          value: http://litellm.gateway.svc.cluster.local:4000/v1
                        - name: GOLDEN_SET
                          value: /evals/golden.jsonl
                        - name: EVAL_KEY
                          valueFrom:
                            secretKeyRef:
                              name: eval-runner-key
                              key: key
                      volumeMounts:
                        - name: evals
                          mountPath: /evals
                      resources:
                        requests:
                          cpu: 50m
                          memory: 64Mi
                        limits:
                          memory: 128Mi
                  volumes:
                    - name: evals
                      configMap:
                        name: gateway-evals
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
