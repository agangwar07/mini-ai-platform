apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: evals
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/agangwar07/mini-ai-platform
    targetRevision: main
    path: platform/evals
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
