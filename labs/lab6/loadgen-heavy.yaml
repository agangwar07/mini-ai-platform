apiVersion: v1
kind: Pod
metadata:
  name: loadgen-heavy
  namespace: team-grid
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: curlimages/curl:8.11.1
      env:
        - name: KEY
          valueFrom: { secretKeyRef: { name: loadgen-key, key: key } }
      resources: { limits: { cpu: 100m, memory: 64Mi } }
      command: ["sh", "-c"]
      args:
        - |
          for n in 1 2 3; do
            while true; do
              curl -s -N -o /dev/null -w "heavy %{http_code} %{time_total}s\n" \
                http://litellm.gateway:4000/v1/chat/completions \
                -H "Authorization: Bearer $KEY" -H 'Content-Type: application/json' \
                -d '{"model":"local-small","stream":true,"max_tokens":400,"messages":[{"role":"user","content":"Write a detailed explanation of how a gas turbine works."}]}'
            done &
          done
          wait
