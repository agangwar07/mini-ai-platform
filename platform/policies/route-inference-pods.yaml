apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: route-inference-pods
spec:
  rules:
    - name: add-toleration-and-selector
      match:
        any:
          - resources:
              kinds: [Pod]
              selector:
                matchLabels:
                  platform.io/workload: inference
      mutate:
        patchStrategicMerge:
          spec:
            nodeSelector:
              pool: inference
            tolerations:
              - key: workload
                operator: Equal
                value: inference
                effect: NoSchedule
