apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db
  namespace: gateway
spec:
  refreshInterval: 1m
  secretStoreRef: { name: aws-secrets-manager, kind: SecretStore }
  target: { name: litellm-db, creationPolicy: Owner }
  data:
    - secretKey: username
      remoteRef: { key: mini-ai-platform/gateway/litellm, property: db_username }
    - secretKey: password
      remoteRef: { key: mini-ai-platform/gateway/litellm, property: db_password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-masterkey
  namespace: gateway
spec:
  refreshInterval: 1m
  secretStoreRef: { name: aws-secrets-manager, kind: SecretStore }
  target: { name: litellm-masterkey, creationPolicy: Owner }
  data:
    - secretKey: masterkey
      remoteRef: { key: mini-ai-platform/gateway/litellm, property: master_key }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-env
  namespace: gateway
spec:
  refreshInterval: 1m
  secretStoreRef: { name: aws-secrets-manager, kind: SecretStore }
  target: { name: litellm-env, creationPolicy: Owner }
  data:
    - secretKey: LITELLM_SALT_KEY
      remoteRef: { key: mini-ai-platform/gateway/litellm, property: salt_key }
    - secretKey: LANGFUSE_PUBLIC_KEY
      remoteRef: { key: mini-ai-platform/gateway/litellm, property: langfuse_public_key }
    - secretKey: LANGFUSE_SECRET_KEY
      remoteRef: { key: mini-ai-platform/gateway/litellm, property: langfuse_secret_key }
    - secretKey: LANGFUSE_HOST
      remoteRef: { key: mini-ai-platform/gateway/litellm, property: langfuse_host }
    - secretKey: LANGFUSE_OTEL_HOST
      remoteRef: { key: mini-ai-platform/gateway/litellm, property: langfuse_host }
